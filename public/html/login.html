<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>RIVERLAND - Acceso</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Unbounded:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/login.css" />
        <link rel="stylesheet" href="../css/brutalist-theme.css" />
    </head>
    <body class="brutalist-theme">
        <div class="grain-overlay"></div>
        <div class="login-container">
            <header>
                <h1>RIVERLAND</h1>
                <p class="subtitle">ZONA DE GESTIÓN</p>
            </header>

            <main class="grid-container">
                <section class="card brutalist-card">
                    <h2>ACCESO</h2>
                    <div class="input-group">
                        <input
                            type="text"
                            id="inputEmail"
                            placeholder="EMAIL"
                        />
                    </div>
                    <div class="input-group">
                        <input type="password" id="inputPassword" placeholder="CONTRASEÑA" />
                    </div>
                    <button class="btn-primary" id="tokenButton">ENTRAR</button>
                    <a href="ecommerce.html" class="back-link">← VOLVER</a>
                </section>

                <div id="mensajeEstado" class="mensaje-oculto"></div>
            </main>
        </div>

        <script src="../js/login.js"></script>
    </body>
</html>
