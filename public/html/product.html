<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - Sticky M.A</title>
    <link rel="stylesheet" href="../css/ecomm.css">
    <link rel="stylesheet" href="../css/product.css">
    <script src="../js/product.js" defer></script>
</head>
<body>
    <div class="container">
        <nav class="navbar product-nav">
            <a href="ecommerce.html" class="back-link">← Volver</a>
            <div class="brand-logo">
                <img src="https://tienda-stickyma.com/cdn/shop/files/etiqueta.png?v=1743072747&width=520" alt="Logo" />
            </div>
            <div class="spacer"></div>
        </nav>

        <main class="product-detail-container">
            <section class="product-visuals">
                <div class="main-image-container">
                    <img id="imagen-producto" src="" alt="Cargando..." class="mainImage"/>
                </div>
            </section>

            <section class="product-info-panel">
                <div class="info-header">
                    <p class="category-tag">Nueva Colección</p>
                    <h1 id="titulo-producto">Cargando producto...</h1>
                    <p class="price-tag" id="precio-producto">-- €</p>
                </div>

                <div class="product-description">
                    <h3>Descripción</h3>
                    <p id="descripcion-producto">
                        Esta es una pieza exclusiva de la colección Sticky M.A, diseñada con materiales de alta calidad y un ajuste minimalista.
                    </p>
                    
                </div>
            </section>
        </main>
    </div>
</body>
</html>
